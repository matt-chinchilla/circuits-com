<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon ladder — each size is its OWN drawing from the logo's optical
         ladder (exploration 13c), not one master scaled down: stroke weights
         thicken and the plate inset tightens as the size drops, and at 16px the
         ground stem is omitted entirely because it cannot survive 16 device
         pixels. Deliberately NO favicon.svg: browsers prefer an SVG icon over
         every sized PNG, which would throw that per-size tuning away. -->
    <!-- ?v= is a CACHE BUST, and it is load-bearing. Browsers cache favicons
         far more aggressively than any other asset — they routinely ignore a
         hard reload and a container rebuild both, keying on the URL alone. The
         mark changed identity here (a purple "Beep Boop Inc." blob became the
         Circuit Center badge), so without a new URL a returning visitor keeps
         seeing the old company's icon indefinitely. Bump this whenever the
         artwork changes; leave it alone otherwise, so the icon stays cached. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png?v=2">
    <link rel="icon" type="image/png" sizes="24x24" href="/images/favicon-24x24.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png?v=2">
    <link rel="icon" href="/images/favicon.ico?v=2" type="image/x-icon">
    <link rel="shortcut icon" href="/images/favicon.ico?v=2" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Circuit Center — Electronic components directory. Compare prices and stock for 170,000+ ICs, MCUs, sensors, and more from dozens of distributors. Find datasheets, check availability, and buy PCB components." />
    <meta name="keywords" content="electronic components, buy ICs, circuit components, PCB parts, integrated circuits, microcontrollers, sensors, capacitors, resistors, distributor comparison, component pricing, datasheets" />
    <!-- No static canonical, and the title/description below are the GENERIC
         ones on purpose. This file is both the shell scripts/seoPrerender.ts
         rewrites per route at build time AND the SPA fallback still served for
         every route the prerender doesn't cover (part pages, keyword profiles,
         404s) — a canonical hardcoded here would be inherited by all ~3,600
         part URLs. Helmet also appends rather than replaces a tag it doesn't
         own, so a hardcoded one made every page advertise two canonicals
         (2026-06-03); the prerendered documents carry helmet's data-rh marker
         so the client swaps those tags instead of duplicating them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Circuit Center" />
    <meta property="og:title" content="Circuit Center — The Integrated Circuits Directory" />
    <meta property="og:description" content="Compare prices and stock for 170,000+ electronic components from dozens of distributors. ICs, MCUs, sensors, and more." />
    <meta property="og:url" content="https://circuitcenter.ai/" />
    <meta property="og:image" content="https://circuitcenter.ai/images/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Circuit Center — The Integrated Circuits Directory" />
    <meta name="twitter:description" content="Compare prices and stock for 170,000+ electronic components from dozens of distributors." />
    <meta name="twitter:image" content="https://circuitcenter.ai/images/og-default.png" />
    <!-- Phosphor Light icon font — self-hosted to avoid CDN/firewall flakiness.
         Files live under frontend/public/fonts/phosphor-light/ (style.css + woff2
         + woff + ttf, ~ 1.2 MB committed). CSS uses relative ./Phosphor-Light.woff2
         which Vite serves from the public/ root at the deployed path. font-display:
         block (set in style.css) suppresses the FOUT — text-as-icon flash — while
         the woff2 loads. -->
    <link rel="preload" href="/fonts/phosphor-light/Phosphor-Light.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/phosphor-light/style.css" />
    <title>Circuit Center — The Integrated Circuits Directory</title>
    <script>
    // Category-page LCP preload (2026-05-30): when the request URL is
    // /category/<slug>, kick off the API fetch at HTML parse time so the
    // response lands in the Service Worker cache before React mounts. The
    // <Suspense> + useEffect chain otherwise can't fire the fetch until
    // ~400 ms after navigation start. Stores the in-flight promise on
    // window.__categoryPreload so api.ts can reuse it (avoids a duplicate
    // origin fetch when the SW cache is cold).
    //
    // The query string below is CANONICAL_CATEGORY_QUERY from
    // src/public/services/categoryQuery.ts — the default first page. It is
    // hard-coded because this script runs at HTML parse time, before any
    // module exists to import from; src/public/services/categoryQuery.test.ts
    // asserts this file still contains that exact string, and api.ts's reuse
    // guard compares the whole string, so a drift costs a wasted fetch rather
    // than wrong rows. Sorting/filtering/paging are server params now
    // (parts_per_page=25, not the old 500-row slab that truncated the page).
    (function(){
      // Capture the LAST path segment: flat /category/<slug> OR nested
      // /category/<parent>/<child>. The child slug is globally unique and is
      // what api.getCategory fetches, so preloading it (not the parent) keeps
      // the cache-hit alive for subcategory pages too (2026-06-03 nested URLs).
      var m = location.pathname.match(/^\/category\/(?:[^\/?#]+\/)*([^\/?#]+)/);
      if (!m) return;
      // A deep link carrying page/sort/filter params asks for different rows,
      // so the page will decline this preload — don't spend the request.
      if (/[?&](p|sort|dir|q|mfg|sub)=/.test(location.search)) return;
      var slug = m[1];
      var query = 'popular_page=1&popular_per_page=1&parts_page=1&parts_per_page=25';
      var path = '/api/categories/' + slug + '/?' + query;
      try {
        window.__categoryPreload = {
          slug: slug,
          query: query,
          promise: fetch(path, { credentials: 'omit' }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
        };
      } catch (_) { /* ignore — page will fetch through axios */ }
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    (function(){
      if(location.pathname.startsWith('/admin'))return;
      var sid=sessionStorage.getItem('_cid');
      if(!sid){sid=crypto.randomUUID();sessionStorage.setItem('_cid',sid)}
      var last='';
      function t(p){
        if(p===last)return;last=p;
        var b=JSON.stringify({path:p,referrer:document.referrer||null,session_id:sid});
        if(navigator.sendBeacon){navigator.sendBeacon('/api/track',new Blob([b],{type:'application/json'}))}
        else{fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:b,keepalive:true}).catch(function(){})}
      }
      t(location.pathname);
      var ps=history.pushState;
      history.pushState=function(){ps.apply(this,arguments);t(location.pathname)};
      var rs=history.replaceState;
      history.replaceState=function(){rs.apply(this,arguments);t(location.pathname)};
      window.addEventListener('popstate',function(){t(location.pathname)});
    })();
    </script>
  </body>
</html>
