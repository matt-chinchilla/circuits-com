server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Service worker + its registration script must always revalidate so
    # browsers pick up new caching rules on deploy. MUST precede the generic
    # .js immutable rule (exact-match location wins over regex regardless of
    # order, but keep it first for readability).
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2|woff|ttf|png|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Home is served from its OWN prerendered document, not index.html.
    # index.html has to stay the generic fallback below for every route the
    # prerender doesn't cover (part pages, keyword profiles, 404s) — baking
    # home's canonical into it would make all 3,600 part URLs advertise
    # `rel=canonical -> /`. Falls back to index.html if home.html is absent,
    # so a build without the prerender step still serves the site.
    location = / {
        try_files /home.html /index.html;
        add_header Cache-Control "no-cache";
    }

    # index.html (and every SPA-fallback route) is the UNHASHED entry point
    # that maps to the hashed asset bundles. It MUST revalidate on every load
    # so a browser never pairs a stale index.html with a newer asset set —
    # that mismatch 404s the old chunk hashes ("failed to preload the CSS").
    # Hashed assets above stay immutable; only the HTML document is no-cache.
    #
    # `$uri/index.html` (before the bare `$uri/`) is what serves the build-time
    # SEO prerender: /about resolves to /about/index.html, /category/a/b to
    # /category/a/b/index.html. It is spelled out rather than left to the
    # `index` directive so a directory request can never turn into a 301.
    # Anything with no prerendered document still lands on the SPA shell.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
