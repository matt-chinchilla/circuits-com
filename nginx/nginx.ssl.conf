upstream frontend {
    server frontend:80;
}

upstream api {
    server api:8000;
}

# Edge gzip — compress proxied responses (category JSON from the api
# upstream + the JS bundle from the frontend upstream). The inner
# frontend/nginx.conf gzip does NOT cover what THIS edge proxies, and
# gzip_proxied is required because nginx skips compressing proxied
# responses by default. Cold mobile category load 639 -> 189 KB (3.4x).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# HTTP → HTTPS for every hostname we serve
server {
    listen 80;
    server_name circuitcenter.ai www.circuitcenter.ai;
    return 301 https://circuitcenter.ai$request_uri;
}

# 301: www.circuitcenter.ai → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.circuitcenter.ai;

    ssl_certificate /etc/letsencrypt/live/circuitcenter.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circuitcenter.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://circuitcenter.ai$request_uri;
}

# Primary site — HTTP/2 enabled so the browser multiplexes all critical
# resources (CSS + JS chunks + the category API call) over ONE connection
# instead of serializing 18+ requests across 6 HTTP/1.1 connections.
# Was the dominant cause of the category-page LCP regression (2026-05-30):
# the SW-cached API response is 3 ms, but the fetch couldn't FIRE until
# 419 ms because chunk downloads were queued behind connection limits.
server {
    listen 443 ssl;
    http2 on;
    server_name circuitcenter.ai;

    ssl_certificate /etc/letsencrypt/live/circuitcenter.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/circuitcenter.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # /pricing merged into /join (2026-08-14). The SPA redirects too, but only
    # for JS-executing clients — crawlers on the previously-sitemapped URL need
    # a real 301 to consolidate link equity instead of a soft-404 shell.
    location = /pricing {
        return 301 /join;
    }

    # The sitemap index and the part sitemaps are STATIC files the frontend
    # build writes beside the prerendered part pages (scripts/seoPrerender.ts),
    # so a part URL is advertised if and only if its document exists. They
    # used to be rendered here by the API from a live ranked query (~9s per
    # fetch on prod) while the documents came from the committed manifest; the
    # two drifted apart nightly and 35% of sampled part URLs served the shell
    # (audit 2026-09-21). A 404 from the frontend (a build that shipped no
    # sitemap, or a page number past the end) falls back to the API, whose
    # index then names the core child only — see @sitemap_from_api.
    location = /sitemap.xml {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = @sitemap_from_api;
    }

    # Must stay ABOVE the generic sitemap-* regex below: nginx takes the FIRST
    # matching regex location, and that one would send these to the API.
    location ~ ^/sitemap-parts-[0-9]+\.xml$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 = @sitemap_from_api;
    }

    location @sitemap_from_api {
        proxy_pass http://api/api$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /sitemap-core.xml (static pages + the category taxonomy) stays live on
    # the API. Every child lives at the ROOT, not under /api/: a sitemap may
    # only list URLs at or below its own path, so a child served from /api/
    # could legally claim nothing but /api/* URLs.
    location ~ ^/(sitemap-[a-z0-9-]+\.xml)$ {
        proxy_pass http://api/api/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # Feed-run observer streams (POST sync/import + GET feed-run) idle up
        # to their 20s server heartbeat; 300s gives belt-and-braces over the
        # 60s default so a quiet stream is never cut mid-run (2026-08-20).
        proxy_read_timeout 300s;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http:// https://;
    }

    location /admin {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http:// https://;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
