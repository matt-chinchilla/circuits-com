upstream frontend {
    server frontend:80;
}

upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        # Feed-run observer streams (POST sync/import + GET feed-run) idle up
        # to their 20s server heartbeat; 300s gives belt-and-braces over the
        # 60s default so a quiet stream is never cut mid-run (2026-08-20).
        proxy_read_timeout 300s;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
