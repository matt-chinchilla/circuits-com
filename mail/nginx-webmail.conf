# TLS terminator for webmail at mail.circuitcenter.ai.
#
# Port 80 stays open ONLY for Let's Encrypt renewals and a redirect — the
# renewal hook needs the ACME challenge path reachable, and everything else
# is pushed to HTTPS so a bookmarked http:// link can't quietly serve a
# login form in the clear.

server {
    listen 80;
    server_name mail.circuitcenter.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail.circuitcenter.ai;

    ssl_certificate     /etc/letsencrypt/live/mail.circuitcenter.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.circuitcenter.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS on the mail host only. Scoped deliberately WITHOUT includeSubDomains
    # so it can never affect circuitcenter.ai itself.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Mail attachments — must clear Roundcube's own 25M upload ceiling.
    client_max_body_size 30M;

    # Signature headshots, uploaded from Settings > Identities.
    #
    # Served STATICALLY, straight off the shared volume, and never proxied to
    # Roundcube. The URL is fetched by the RECIPIENT's mail client, which has no
    # Roundcube session, so nothing here may depend on one -- and keeping PHP
    # out of the path makes it cacheable besides.
    #
    # The trailing slash on the alias is load-bearing: `alias /srv/avatars` with
    # a slash on the location and none here concatenates into
    # /srv/avatarsfoo.jpg. Classic nginx footgun, silent 404s.
    location /avatars/ {
        alias /srv/avatars/;

        # Only ever written by the plugin's re-encoder, which emits JPEG. Being
        # explicit means a file that somehow arrives with another extension is
        # still served as an image rather than as whatever nginx guesses.
        default_type image/jpeg;
        types { image/jpeg jpg jpeg; }

        # The bytes are ones our re-encoder produced, but a browser sniffing its
        # way to a different type is exactly how an "image" upload becomes a
        # script. Belt and braces on a public, writable-by-upload path.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        # Filenames carry a random suffix and a replaced photo gets a new one,
        # so a long cache can never serve a stale face.
        expires 30d;
        add_header Cache-Control "public, immutable" always;

        autoindex off;
        access_log off;
    }

    location / {
        proxy_pass http://roundcube:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Roundcube's compose/upload flows are slow on a small box; the default
        # 60s read timeout truncates large attachment uploads mid-stream.
        proxy_read_timeout 300s;
    }
}
