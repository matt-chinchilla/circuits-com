<?xml version="1.0" encoding="UTF-8"?>
<!--
  Circuit Center webmail wordmark. This file shadows Elastic's stock
  images/logo.svg (Roundcube's 3D cube) via skin-path resolution — the
  login template asks for /images/logo.svg and Roundcube looks in this
  skin before the parent.

  Self-contained: no external references; the text renders in the same
  OS-native stacks the skin uses (SF/Segoe sans for the name, the mono
  stack for the MAIL tag). Drawn for the dark bench: silkscreen-white
  IC outline, ENIG-gold leads and tag, one phosphor trace.
  Sized by the skin (html.cc .task-login #logo — Elastic otherwise pins
  #logo to a 100px square).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="232" height="56" viewBox="0 0 232 56" role="img" aria-label="Circuit Center Mail">
	<!-- IC package -->
	<rect x="10" y="11" width="34" height="34" rx="4" fill="rgba(255,255,255,0.06)" stroke="#d9e6de" stroke-width="1.6"/>
	<!-- pin-1 index dot -->
	<circle cx="17" cy="18" r="1.8" fill="#e8c252"/>
	<!-- ENIG leads -->
	<g fill="#e8c252">
		<rect x="3" y="15" width="7" height="3.2" rx="1"/>
		<rect x="3" y="26.4" width="7" height="3.2" rx="1"/>
		<rect x="3" y="37.8" width="7" height="3.2" rx="1"/>
		<rect x="44" y="15" width="7" height="3.2" rx="1"/>
		<rect x="44" y="26.4" width="7" height="3.2" rx="1"/>
		<rect x="44" y="37.8" width="7" height="3.2" rx="1"/>
	</g>
	<!-- phosphor trace -->
	<path d="M17 38 h7 l5 -7 h9" fill="none" stroke="#44bd13" stroke-width="1.6" stroke-linecap="square"/>
	<!-- wordmark -->
	<text x="60" y="28" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Inter,system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="-0.2" fill="#f2f7f4">Circuit Center</text>
	<text x="61" y="45" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" letter-spacing="4" fill="#e8c252">MAIL</text>
</svg>
