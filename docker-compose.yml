services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: circuits
      POSTGRES_USER: circuits
      POSTGRES_PASSWORD: circuits
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuits -d circuits"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://circuits:circuits@db:5432/circuits
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      ADMIN_USERNAME: ${SQLADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SQLADMIN_PASSWORD:-admin}
      ADMIN_SECRET_KEY: change-me-in-production
      # One-click demo access (POST /api/auth/demo). The CODE default is OFF
      # (app/config.py) — this passthrough is what makes the switch live at all,
      # since pydantic-settings reads process env and the api container has no
      # volume mount (it never sees a host .env). Dev opts IN so the "See Demo"
      # button works locally; prod defaults it back to false
      # (docker-compose.prod.yml). Guarded by tests/test_compose_env_passthrough.py.
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:-demo@circuitcenter.ai}
      # Fictional demo catalog in the seed (Kennedy Electronics, Mike's Electric,
      # + their showcase Platinum/Gold sponsorships). Dev keeps them so a fresh
      # local DB has sold boards to look at; prod defaults this OFF
      # (docker-compose.prod.yml) so an owner's /admin deletion of a fictional
      # company isn't undone by the next container start. MIRRORS the code
      # default in app/config.py — an allowlist entry that contradicts the code
      # default silently overrides it.
      SEED_DEMO_CATALOG: ${SEED_DEMO_CATALOG:-true}
      # Shared calendar. Same rule as every block here: this list is an
      # ALLOWLIST, not documentation. Settings declares no env_file and the api
      # container has no volume mount, so a value absent from this block never
      # reaches pydantic-settings however carefully it was written into a host
      # .env — which is exactly how DEMO_LOGIN_ENABLED shipped inert.
      # Without CALENDAR_API_SECRET the Roundcube plugin's every call 401s and
      # the calendar is permanently unreachable from the webmail.
      CALENDAR_API_SECRET: ${CALENDAR_API_SECRET:-}
      # MUST mirror Settings.CALENDAR_RECIPIENTS. An empty default here does
      # NOT fall back to the code default — pydantic-settings sees the empty
      # string, the CSV validator parses it to [], and the roster is DESTROYED
      # rather than inherited. Observed live: the job found a due event, took
      # its ledger claim, then had nobody to send to. Same trap the
      # MAIL_SYNC_MAILBOXES comment above records.
      CALENDAR_RECIPIENTS: ${CALENDAR_RECIPIENTS:-anthony@circuitcenter.ai,daniel@circuitcenter.ai,matthew@circuitcenter.ai,ronald@circuitcenter.ai}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-America/New_York}
      CALENDAR_REMINDER_LOOKBACK_MINUTES: ${CALENDAR_REMINDER_LOOKBACK_MINUTES:-720}
      # SMS reminders — OFF until a topic ARN exists. app/services/sms.py is
      # inert (never raises) when this is empty, so email reminders are
      # unaffected by an unconfigured or broken SNS setup.
      SMS_TOPIC_ARN: ${SMS_TOPIC_ARN:-}
      SMS_REGION: ${SMS_REGION:-}
      # ── Stripe (Billing / Invoicing / Tax) ────────────────────────────
      # This block is an ALLOWLIST, not documentation. Settings declares no
      # env_file and the api container has no volume mount, so a key sitting
      # in /opt/circuits-com/.env that is not named here NEVER reaches the
      # app. DEMO_LOGIN_ENABLED shipped inert exactly this way.
      #
      # SECRET is server-side only and must never be handed to the frontend
      # build; PUBLIC is publishable by design and safe in a browser.
      # A `sk_test_` key is sandbox and cannot move real money.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      # Webhook signing secret (whsec_…) — verifies POST /api/stripe/webhook.
      # Empty = the route 404s and billing events change nothing.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Onboarding rep credited (Sponsor.sold_by) for self-serve checkout sales.
      SELF_SERVE_ONBOARDING_REP: ${SELF_SERVE_ONBOARDING_REP:-Daniel}
      # ── Distributor part feed (Mouser Search API) ─────────────────────
      # Powers POST /api/suppliers/{id}/sync. Empty = the route 404s
      # ("sync_unavailable") and the admin console shows the feature as
      # unconfigured — same feature-off posture as the Stripe routes.
      #
      # The HOST variable is deliberately NOT named MOUSER_API_KEY: a stale,
      # INVALID key by that name already lives in some host environments, and
      # `${MOUSER_API_KEY:-}` would hand it straight to the container, where a
      # 401 from Mouser is a FeedFatalError — the sync would fail while
      # looking configured. MOUSER_SEARCH_API_KEY is the working key's home.
      MOUSER_API_KEY: ${MOUSER_SEARCH_API_KEY:-}
      # NOTE deliberately ABSENT here: ANTHROPIC_ADMIN_KEY. It is an
      # ORGANIZATION-level admin credential and only the cost-sync service
      # reads it — the internet-facing api container must not carry a secret
      # it never uses (2026-08-11 review finding).
      # SMTP — empty defaults trigger demo mode in app.services.email.
      # Populate via .env on prod EC2 host (see CLAUDE.md gotcha).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@circuitcenter.ai}
      NOTIFY_RECIPIENTS: ${NOTIFY_RECIPIENTS:-mc@matthew-chirichella.com}
      # P3 mailbox credential push-sync (app/services/mail_sync.py). Empty by
      # default: a dev box has no mail server, and with either half unset the
      # channel is inert — password changes still work, they just don't sync.
      # The secret is shared with the receiver on the mail box and lives only
      # in /opt/circuits-com/.env there and on prod; never commit a value.
      MAIL_SYNC_URL: ${MAIL_SYNC_URL:-}
      MAIL_SYNC_SECRET: ${MAIL_SYNC_SECRET:-}
      # Must stay identical to Settings.MAIL_SYNC_MAILBOXES (guarded by
      # tests/test_mail_sync.py) — an empty value would disable syncing for
      # every account rather than for none.
      MAIL_SYNC_MAILBOXES: ${MAIL_SYNC_MAILBOXES:-anthony@circuitcenter.ai,daniel@circuitcenter.ai,matthew@circuitcenter.ai,ronald@circuitcenter.ai,no-reply@circuitcenter.ai}

  # Calendar reminders. `app.jobs.send_reminders` is a one-shot: it finds the
  # reminders that are due, sends them, and exits. Until this service existed
  # NOTHING CALLED IT — the job was complete, tested, and never ran, so half
  # the calendar was inert on delivery.
  #
  # A compose service rather than a host crontab, because everything else
  # about this stack is declared in these files. A crontab is invisible state
  # on one box: `docker compose ps` never shows it, a rebuilt instance loses
  # it, and nothing tells you it stopped.
  #
  # Two details that look sloppy and are not. `|| true` keeps one failed pass
  # from killing the container and silencing every future reminder. And a
  # dumb sleep loop is adequate precisely BECAUSE idempotency lives in the
  # database — UNIQUE(event_id, kind, channel) means running early, twice, or
  # overlapping sends nothing extra, so there is nothing for a real scheduler
  # to buy. Same image as api (already built, so no second build cost).
  calendar-reminders:
    build:
      context: ./api
    restart: unless-stopped
    # api, not db: `alembic upgrade head` runs in the api container's
    # entrypoint, and this loop queries tables that migration creates. Ordering
    # after api narrows the window — it does not close it, because
    # service_started means "the container is up", not "migrations finished".
    # The job handles the remaining gap itself: a missing table is one warning
    # line and a skipped pass, not the UndefinedTable traceback every five
    # minutes that the first boot of this service actually produced.
    depends_on:
      - db
      - api
    command: >
      sh -c "while true; do
               python -m app.jobs.send_reminders || true;
               sleep ${CALENDAR_REMINDER_INTERVAL_SECONDS:-300};
             done"
    environment:
      DATABASE_URL: postgresql://circuits:circuits@db:5432/circuits
      # MUST mirror Settings.CALENDAR_RECIPIENTS. An empty default here does
      # NOT fall back to the code default — pydantic-settings sees the empty
      # string, the CSV validator parses it to [], and the roster is DESTROYED
      # rather than inherited. Observed live: the job found a due event, took
      # its ledger claim, then had nobody to send to. Same trap the
      # MAIL_SYNC_MAILBOXES comment above records.
      CALENDAR_RECIPIENTS: ${CALENDAR_RECIPIENTS:-anthony@circuitcenter.ai,daniel@circuitcenter.ai,matthew@circuitcenter.ai,ronald@circuitcenter.ai}
      CALENDAR_TIMEZONE: ${CALENDAR_TIMEZONE:-America/New_York}
      CALENDAR_REMINDER_LOOKBACK_MINUTES: ${CALENDAR_REMINDER_LOOKBACK_MINUTES:-720}
      SMS_TOPIC_ARN: ${SMS_TOPIC_ARN:-}
      SMS_REGION: ${SMS_REGION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@circuitcenter.ai}

  # Automated cost sync. `app.jobs.sync_costs` pulls REAL spend (AWS Cost
  # Explorer, Stripe settlement fees) into the `expenses` table so the admin
  # Cost Breakdown shows actuals instead of the seeded list-price estimate.
  #
  # Unlike calendar-reminders this one loops INSIDE python (`main()` sleeps an
  # hour between passes) rather than in a shell `while`, because the pass has
  # real state to protect: the AWS staleness gate reads the newest synced row
  # before deciding to spend a $0.01 Cost Explorer call, and a process that
  # exits and restarts each pass makes a crash loop expensive. `restart:
  # unless-stopped` still covers a genuine crash, and the gate makes the
  # restart cheap.
  cost-sync:
    build:
      context: ./api
    restart: unless-stopped
    # Same ordering caveat as calendar-reminders: `alembic upgrade head` runs
    # in the api container's entrypoint, so service_started narrows the window
    # but does not close it. The job tolerates the gap itself — a missing
    # column is one warning and a skipped pass, not a traceback.
    depends_on:
      - db
      - api
    command: python -m app.jobs.sync_costs
    environment:
      DATABASE_URL: postgresql://circuits:circuits@db:5432/circuits
      # Free to call, so it syncs every pass. Empty = no fee sync at all.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      # Flat bills planted monthly (recurring.py). MIRRORS the Settings
      # default — an empty ${VAR:-} would DESTROY it (allowlist rule).
      RECURRING_MONTHLY_EXPENSES: ${RECURRING_MONTHLY_EXPENSES:-ai:Claude Max subscription:200.00}
      # Cost Explorer has ONE endpoint region for every account. The client
      # pins us-east-1 itself; this is here so anything else in the container
      # that reaches AWS agrees with it.
      AWS_DEFAULT_REGION: us-east-1
    # DEV ONLY: boto3's default credential chain finds the operator's CLI
    # credentials here, so a local run reads the real account read-only. PROD
    # resets this mount (docker-compose.prod.yml) — the EC2 box uses the
    # circuits-cost-explorer-read instance profile through IMDS instead, and
    # there is no ~/.aws on it to mount.
    volumes:
      - ${HOME}/.aws:/root/.aws:ro

  # Nightly catalog import. `app.jobs.feed_import_daily` sleeps to the next
  # FEED_IMPORT_HOUR_UTC boundary, then runs one import for every supplier
  # whose "Nightly auto-import" switch is on, inside ONE shared call budget.
  #
  # A separate service rather than a thread in api, for the same reason
  # calendar-reminders and cost-sync are: the run takes hours (the provider
  # sleeps ~2.1s between calls under the free tier's ~30/min), and a long
  # blocking job inside the request container is a request container that is
  # sometimes not answering requests.
  #
  # The loop lives INSIDE python (like cost-sync, unlike calendar-reminders'
  # shell `while`) because the schedule is a CLOCK BOUNDARY, not an interval:
  # the job computes the seconds to the next 06:00 UTC and sleeps exactly
  # that, so a restart cannot walk the run time across the day. It also sleeps
  # BEFORE its first pass — a crash loop must never spend the day's quota on
  # every boot.
  feed-import:
    build:
      context: ./api
    restart: unless-stopped
    # Same ordering caveat as calendar-reminders: `alembic upgrade head` runs
    # in the api container's entrypoint, so service_started narrows the window
    # but does not close it. The job tolerates the gap itself — a missing
    # table is one warning and a skipped pass, not a traceback.
    depends_on:
      - db
      - api
    command: python -m app.jobs.feed_import_daily
    environment:
      DATABASE_URL: postgresql://circuits:circuits@db:5432/circuits
      # This block is an ALLOWLIST and this is a SEPARATE container — it
      # inherits nothing from the api service. Both defaults MIRROR
      # app/config.py; an empty `${VAR:-}` would not fall back to the code
      # default, it would overwrite it (the CALENDAR_RECIPIENTS trap).
      FEED_IMPORT_HOUR_UTC: ${FEED_IMPORT_HOUR_UTC:-6}
      FEED_IMPORT_CALL_BUDGET: ${FEED_IMPORT_CALL_BUDGET:-850}
      # The provider key, mapped from the HOST variable MOUSER_SEARCH_API_KEY
      # exactly as the api service does (the same-named host value is a
      # known-invalid legacy key). A key stored from Admin → Settings WINS
      # over this one — `registry.get_feed_key` asks the DB first — so this is
      # the fallback for a box configured only through .env. Empty = every
      # supplier is skipped with a log line, which is the correct "not
      # configured" state.
      MOUSER_API_KEY: ${MOUSER_SEARCH_API_KEY:-}

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  n8n:
    build: ./n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      WEBHOOK_URL: http://n8n:5678
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  n8n-data:
