services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: circuits
      POSTGRES_USER: circuits
      POSTGRES_PASSWORD: circuits
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuits -d circuits"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://circuits:circuits@db:5432/circuits
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      ADMIN_USERNAME: ${SQLADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SQLADMIN_PASSWORD:-admin}
      ADMIN_SECRET_KEY: change-me-in-production
      # One-click demo access (POST /api/auth/demo). The CODE default is OFF
      # (app/config.py) — this passthrough is what makes the switch live at all,
      # since pydantic-settings reads process env and the api container has no
      # volume mount (it never sees a host .env). Dev opts IN so the "See Demo"
      # button works locally; prod defaults it back to false
      # (docker-compose.prod.yml). Guarded by tests/test_compose_env_passthrough.py.
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:-demo@circuitcenter.ai}
      # SMTP — empty defaults trigger demo mode in app.services.email.
      # Populate via .env on prod EC2 host (see CLAUDE.md gotcha).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@circuitcenter.ai}
      NOTIFY_RECIPIENTS: ${NOTIFY_RECIPIENTS:-mc@matthew-chirichella.com}
      # P3 mailbox credential push-sync (app/services/mail_sync.py). Empty by
      # default: a dev box has no mail server, and with either half unset the
      # channel is inert — password changes still work, they just don't sync.
      # The secret is shared with the receiver on the mail box and lives only
      # in /opt/circuits-com/.env there and on prod; never commit a value.
      MAIL_SYNC_URL: ${MAIL_SYNC_URL:-}
      MAIL_SYNC_SECRET: ${MAIL_SYNC_SECRET:-}
      # Must stay identical to Settings.MAIL_SYNC_MAILBOXES (guarded by
      # tests/test_mail_sync.py) — an empty value would disable syncing for
      # every account rather than for none.
      MAIL_SYNC_MAILBOXES: ${MAIL_SYNC_MAILBOXES:-anthony@circuitcenter.ai,daniel@circuitcenter.ai,matthew@circuitcenter.ai,ronald@circuitcenter.ai,no-reply@circuitcenter.ai}

  frontend:
    build: ./frontend
    ports:
      - "3000:80"

  n8n:
    build: ./n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      WEBHOOK_URL: http://n8n:5678
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
  n8n-data:
